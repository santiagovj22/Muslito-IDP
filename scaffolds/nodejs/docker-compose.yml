version: '3.9'

services:
  app:
    build:
      context: .
      target: build        # uses the build stage so tsx hot-reload works
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: development
      PORT: 3000
      LOG_LEVEL: debug
    env_file:
      - .env
    volumes:
      - ./src:/app/src      # mount src for hot-reload via tsx watch
    command: npm run dev
    depends_on: []
      # - db
      # - cache
    restart: unless-stopped

