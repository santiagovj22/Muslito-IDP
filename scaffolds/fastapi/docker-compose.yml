version: '3.9'

services:
  app:
    build:
      context: .
      target: production
    ports:
      - '8000:8000'
    environment:
      APP_ENV: development
      LOG_LEVEL: DEBUG
    env_file:
      - .env
    volumes:
      - ./app:/app/app   # hot-reload in dev
    depends_on: []
      # - db
      # - cache
    restart: unless-stopped

