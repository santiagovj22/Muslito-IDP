name: Deploy Docs

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
  # Allow triggering manually from the Actions tab
  workflow_dispatch:

# Only one deployment runs at a time; cancel any in-progress run
concurrency:
  group: github-pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write       # required to deploy to GitHub Pages
  id-token: write    # required for OIDC-based Pages deployment

jobs:
  # ─── Build ──────────────────────────────────────────────────────────────────
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history so git dates are accurate in docs

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: docs

      - name: Build
        run: npm run build
        working-directory: docs

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build

  # ─── Deploy ─────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
