name: Release

on:
  push:
    branches:
      - main
      - beta

# Permissions required by @semantic-release/github and @semantic-release/git
permissions:
  contents: write      # push CHANGELOG.md commit + create tags/releases
  issues: write        # comment on resolved issues
  pull-requests: write # comment on merged PRs

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    # Never run on the automated release commit itself
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # full history required to determine version bumps
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx semantic-release
