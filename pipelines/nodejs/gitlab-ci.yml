# ─── IDP GitLab CI Pipeline — Node.js / Fastify ──────────────────────────────
# Copy this file to your service root as .gitlab-ci.yml
# Required CI/CD variables (set in GitLab → Settings → CI/CD → Variables):
#   AWS_DEPLOY_ROLE_ARN  — IAM role for OIDC-based deployment
#   ECR_REGISTRY         — e.g. 123456789.dkr.ecr.us-east-1.amazonaws.com
#   AWS_REGION           — e.g. us-east-1
#   SERVICE_NAME         — your service name
#   ECS_CLUSTER          — ECS cluster name (for deploy stage)
#   ECS_SERVICE          — ECS service name (for deploy stage)

image: node:22-alpine

stages:
  - lint
  - test
  - security
  - build
  - deploy

variables:
  NODE_ENV: test
  npm_config_cache: "$CI_PROJECT_DIR/.npm"
  DOCKER_DRIVER: overlay2
  DOCKER_BUILDKIT: "1"

# ─── Cache ────────────────────────────────────────────────────────────────────
.node_cache: &node_cache
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
      - node_modules/
    policy: pull-push

# ─── Shared setup ────────────────────────────────────────────────────────────
.install: &install
  before_script:
    - npm ci --cache .npm --prefer-offline

# ─── Lint ─────────────────────────────────────────────────────────────────────
lint:
  stage: lint
  <<: *node_cache
  <<: *install
  script:
    - npm run typecheck
    - npm run lint
    - npm run format:check
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Unit Tests ───────────────────────────────────────────────────────────────
unit-tests:
  stage: test
  <<: *node_cache
  <<: *install
  script:
    - npm run test:unit -- --coverage
  coverage: '/^All files.*\s+([\d.]+)/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: coverage/cobertura-coverage.xml
    paths:
      - coverage/
    expire_in: 7 days
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Integration Tests ────────────────────────────────────────────────────────
integration-tests:
  stage: test
  <<: *node_cache
  <<: *install
  services:
    # Uncomment dependencies your service needs:
    # - name: postgres:16-alpine
    #   alias: db
    # - name: redis:7-alpine
    #   alias: cache
  variables:
    NODE_ENV: test
    # DATABASE_URL: postgresql://postgres:postgres@db:5432/testdb
  script:
    - npm run test:integration
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "main"'

# ─── Security Scan ────────────────────────────────────────────────────────────
security-audit:
  stage: security
  <<: *node_cache
  <<: *install
  script:
    - npm audit --audit-level=high
  allow_failure: false
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

# ─── Build & Push Docker Image ────────────────────────────────────────────────
build-image:
  stage: build
  image: docker:24-dind
  services:
    - docker:24-dind
  variables:
    IMAGE_TAG: $CI_COMMIT_SHORT_SHA
    IMAGE_NAME: $ECR_REGISTRY/$SERVICE_NAME
  before_script:
    - apk add --no-cache aws-cli
    - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY
  script:
    - docker build --target production -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest .
    - docker push $IMAGE_NAME:$IMAGE_TAG
    - docker push $IMAGE_NAME:latest
    - echo "IMAGE_TAG=$IMAGE_TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env
  needs:
    - job: lint
    - job: unit-tests
    - job: integration-tests
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Deploy to Staging ────────────────────────────────────────────────────────
deploy-staging:
  stage: deploy
  image: alpine:latest
  environment:
    name: staging
    url: https://staging.$SERVICE_NAME.example.com
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service $ECS_SERVICE \
        --force-new-deployment \
        --region $AWS_REGION
    - |
      aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services $ECS_SERVICE \
        --region $AWS_REGION
  needs:
    - job: build-image
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

# ─── Deploy to Production ─────────────────────────────────────────────────────
deploy-production:
  stage: deploy
  image: alpine:latest
  environment:
    name: production
    url: https://$SERVICE_NAME.example.com
  before_script:
    - apk add --no-cache aws-cli
  script:
    - |
      aws ecs update-service \
        --cluster $ECS_CLUSTER \
        --service ${ECS_SERVICE}-prod \
        --force-new-deployment \
        --region $AWS_REGION
    - |
      aws ecs wait services-stable \
        --cluster $ECS_CLUSTER \
        --services ${ECS_SERVICE}-prod \
        --region $AWS_REGION
  needs:
    - job: build-image
      artifacts: true
  when: manual   # Require explicit approval for production
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
